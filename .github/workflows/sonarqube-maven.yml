name: SonarQube Scan (Maven)

on:
  workflow_call:

    inputs:
      java-version:
        description: Java Version
        required: false
        default: "21"
        type: string

      distribution:
        description: JDK Distribution
        required: false
        default: "temurin"
        type: string

      maven-command:
        description: Maven goals and arguments (space-separated; not a shell command)
        required: false
        default: "clean verify"
        type: string

      sonar-scanner-version:
        description: SonarScanner CLI version
        required: false
        default: "7.2.0.5079"
        type: string

      sonar-project-key:
        description: Sonar Project Key
        required: true
        type: string

      sonar-project-name:
        description: Sonar Project Name
        required: true
        type: string

      sonar-organization:
        description: SonarCloud Organization (Optional)
        required: false
        default: ""
        type: string

      source-directory:
        description: Source directory
        required: false
        default: "src/main/java"
        type: string

      test-directory:
        description: Test directory
        required: false
        default: "src/test/java"
        type: string

      binaries-directory:
        description: Java compiled classes directory
        required: false
        default: "target/classes"
        type: string

      test-binaries-directory:
        description: Test compiled classes directory
        required: false
        default: "target/test-classes"
        type: string

      junit-report-path:
        description: JUnit XML report directory
        required: false
        default: "target/surefire-reports"
        type: string

      jacoco-report-path:
        description: JaCoCo XML report
        required: false
        default: "target/site/jacoco/jacoco.xml"
        type: string

      timeout:
        description: Maximum wait time for SonarQube analysis, in seconds
        required: false
        default: 300
        type: number

      polling-interval:
        description: Polling interval for SonarQube analysis, in seconds
        required: false
        default: 5
        type: number

    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true

permissions:
  contents: read

concurrency:
  group: sonarqube-maven-${{ github.workflow }}-${{ inputs.sonar-project-key }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  maven-sonarqube-scan-job:
    name: SonarQube Analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Cache Sonar Packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-cache-${{ runner.os }}
          restore-keys: |
            sonar-cache-${{ runner.os }}

      - name: Setup SonarScanner
        uses: Maverick-Joy/reusable-workflows/.github/actions/setup-sonarscanner@main
        with:
          scanner-version: ${{ inputs.sonar-scanner-version }}

      - name: Build & Generate JaCoCo Report
        shell: bash
        env:
          MAVEN_COMMAND: ${{ inputs.maven-command }}
          JACOCO_REPORT_PATH: ${{ inputs.jacoco-report-path }}
        run: |
          set -Eeuo pipefail

          if [[ ! -f ./mvnw ]]; then
            echo "::error::Maven wrapper (mvnw) was not found in the repository root."
            exit 1
          fi

          chmod +x ./mvnw
          read -r -a maven_args <<< "$MAVEN_COMMAND"
          if (( ${#maven_args[@]} == 0 )); then
            echo "::error::maven-command must contain at least one Maven goal or argument."
            exit 1
          fi

          ./mvnw "${maven_args[@]}"

          if [[ ! -f "$JACOCO_REPORT_PATH" ]]; then
            echo "::error::JaCoCo XML report was not generated at '$JACOCO_REPORT_PATH'. Configure the Maven JaCoCo plugin to generate this report during the build."
            exit 1
          fi

      - name: Run SonarScanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
          SONAR_PROJECT_NAME: ${{ inputs.sonar-project-name }}
          SONAR_ORGANIZATION: ${{ inputs.sonar-organization }}
          SONAR_SOURCE_DIRECTORY: ${{ inputs.source-directory }}
          SONAR_TEST_DIRECTORY: ${{ inputs.test-directory }}
          SONAR_BINARIES_DIRECTORY: ${{ inputs.binaries-directory }}
          SONAR_TEST_BINARIES_DIRECTORY: ${{ inputs.test-binaries-directory }}
          SONAR_JUNIT_REPORT_PATH: ${{ inputs.junit-report-path }}
          SONAR_JACOCO_REPORT_PATH: ${{ inputs.jacoco-report-path }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -d "$SONAR_SOURCE_DIRECTORY" ]]; then
            echo "::error::Sonar source directory '$SONAR_SOURCE_DIRECTORY' does not exist."
            exit 1
          fi
          if [[ ! -d "$SONAR_BINARIES_DIRECTORY" ]]; then
            echo "::error::Compiled Java classes directory '$SONAR_BINARIES_DIRECTORY' does not exist."
            exit 1
          fi

          sonar_args=(
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY"
            "-Dsonar.projectName=$SONAR_PROJECT_NAME"
            "-Dsonar.host.url=$SONAR_HOST_URL"
            "-Dsonar.sources=$SONAR_SOURCE_DIRECTORY"
            "-Dsonar.java.binaries=$SONAR_BINARIES_DIRECTORY"
            "-Dsonar.junit.reportPaths=$SONAR_JUNIT_REPORT_PATH"
            "-Dsonar.coverage.jacoco.xmlReportPaths=$SONAR_JACOCO_REPORT_PATH"
          )

          if [[ -n "$SONAR_ORGANIZATION" ]]; then
            sonar_args+=("-Dsonar.organization=$SONAR_ORGANIZATION")
          fi

          if [[ -d "$SONAR_TEST_DIRECTORY" ]]; then
            sonar_args+=("-Dsonar.tests=$SONAR_TEST_DIRECTORY")
            if [[ -d "$SONAR_TEST_BINARIES_DIRECTORY" ]]; then
              sonar_args+=("-Dsonar.java.test.binaries=$SONAR_TEST_BINARIES_DIRECTORY")
            else
              echo "::warning::Test classes directory '$SONAR_TEST_BINARIES_DIRECTORY' was not found; test binaries will not be analyzed."
            fi
          else
            echo "::warning::Test source directory '$SONAR_TEST_DIRECTORY' was not found; test sources will not be analyzed."
          fi

          sonar-scanner "${sonar_args[@]}"

      - name: Validate Quality Gate Timing
        shell: bash
        env:
          SONAR_TIMEOUT: ${{ inputs.timeout }}
          SONAR_POLLING_INTERVAL: ${{ inputs.polling-interval }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$SONAR_TIMEOUT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::timeout must be a positive whole number of seconds."
            exit 1
          fi
          if [[ ! "$SONAR_POLLING_INTERVAL" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::polling-interval must be a positive whole number of seconds."
            exit 1
          fi

      - name: Verify SonarQube Quality Gate
        id: quality-gate
        uses: Maverick-Joy/reusable-workflows/.github/actions/sonarqube-quality-gate@main
        with:
          sonar-host-url: ${{ secrets.SONAR_HOST_URL }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          timeout: ${{ inputs.timeout }}
          polling-interval: ${{ inputs.polling-interval }}

      - name: Upload Sonar Task Metadata
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sonar-task
          path: .scannerwork/report-task.txt

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: maven-test-report
          path: ${{ inputs.junit-report-path }}/**

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: maven-jacoco-report
          path: ${{ inputs.jacoco-report-path }}

      - name: GitHub Step Summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          PROJECT_NAME: ${{ inputs.sonar-project-name }}
          PROJECT_KEY: ${{ inputs.sonar-project-key }}
          JAVA_VERSION: ${{ inputs.java-version }}
          JACOCO_REPORT_PATH: ${{ inputs.jacoco-report-path }}
        run: |
          set -Eeuo pipefail

          project_name="${PROJECT_NAME//$'\n'/ }"
          project_name="${project_name//$'\r'/ }"
          project_name="${project_name//|/\\|}"
          project_key="${PROJECT_KEY//$'\n'/ }"
          project_key="${project_key//$'\r'/ }"
          project_key="${project_key//|/\\|}"
          jacoco_path="${JACOCO_REPORT_PATH//$'\n'/ }"
          jacoco_path="${jacoco_path//$'\r'/ }"
          jacoco_path="${jacoco_path//|/\\|}"

          if [[ "$JOB_STATUS" == "success" ]]; then
            heading="SonarQube Scan Succeeded"
          else
            heading="SonarQube Scan Failed"
          fi

          {
            printf '# %s\n\n' "$heading"
            printf '| Property | Value |\n'
            printf '|----------|-------|\n'
            printf '| Project | %s |\n' "$project_name"
            printf '| Project Key | %s |\n' "$project_key"
            printf '| Java | %s |\n' "$JAVA_VERSION"
            printf '| Build Tool | Maven |\n'
            printf '| JaCoCo XML Report | `%s` |\n' "$jacoco_path"
            printf '| SonarScanner | CLI |\n'
          } >> "$GITHUB_STEP_SUMMARY"