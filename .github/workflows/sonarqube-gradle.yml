name: SonarQube Scan (Gradle)

on:
  workflow_call:
    inputs:
      runner:
        description: Linux x64 GitHub Actions runner
        required: false
        default: ubuntu-26.04
        type: string

      java-version:
        description: Java version
        required: false
        default: "21"
        type: string

      distribution:
        description: JDK distribution
        required: false
        default: temurin
        type: string

      gradle-command:
        description: Gradle goals and arguments (space-separated; not a shell command)
        required: false
        default: clean build jacocoTestReport
        type: string

      sonar-project-key:
        description: Sonar project key
        required: true
        type: string

      sonar-project-name:
        description: Sonar project name
        required: true
        type: string

      sonar-organization:
        description: SonarCloud organization (optional)
        required: false
        default: ""
        type: string

      sonar-sources:
        description: Main source directory relative to the working directory
        required: false
        default: src/main
        type: string

      sonar-tests:
        description: Test source directory relative to the working directory
        required: false
        default: src/test
        type: string

      sonar-java-binaries:
        description: Compiled main Java classes directory relative to the working directory
        required: false
        default: build/classes/java/main
        type: string

      sonar-java-test-binaries:
        description: Compiled test Java classes directory relative to the working directory
        required: false
        default: build/classes/java/test
        type: string

      sonar-junit-report-path:
        description: JUnit XML report directory relative to the working directory
        required: false
        default: build/test-results/test
        type: string

      sonar-jacoco-report-path:
        description: JaCoCo XML report path relative to the working directory
        required: false
        default: build/reports/jacoco/test/jacocoTestReport.xml
        type: string

      sonar-exclusions:
        description: Sonar exclusions
        required: false
        default: ""
        type: string

      sonar-working-directory:
        description: Gradle project directory relative to the repository root
        required: false
        default: .
        type: string

      sonar-additional-args:
        description: Additional SonarScanner arguments (space-separated)
        required: false
        default: ""
        type: string

      test-report-artifact-name:
        description: Test report artifact name
        required: false
        default: gradle-test-report
        type: string

      coverage-report-artifact-name:
        description: Coverage report artifact name
        required: false
        default: jacoco-report
        type: string

      artifact-retention-days:
        description: Artifact retention period
        required: false
        default: 60
        type: number

      sonar-scanner-version:
        description: SonarScanner CLI version
        required: false
        default: "7.2.0.5079"
        type: string

      fetch-depth:
        description: Git fetch depth; use 0 for full history
        required: false
        default: 0
        type: number

      quality-gate-timeout:
        description: Maximum wait time for SonarQube analysis, in seconds
        required: false
        default: 300
        type: number

      quality-gate-polling-interval:
        description: Quality Gate polling interval in seconds
        required: false
        default: 5
        type: number

    secrets:
      SONAR_HOST_URL:
        required: true
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: sonar-gradle-${{ github.workflow }}-${{ inputs.sonar-project-key }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Validate Workflow Inputs and Runner
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
          WORKING_DIRECTORY: ${{ inputs.sonar-working-directory }}
          SONAR_SOURCES: ${{ inputs.sonar-sources }}
          SONAR_TESTS: ${{ inputs.sonar-tests }}
          SONAR_BINARIES: ${{ inputs.sonar-java-binaries }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
          SONAR_PROJECT_NAME: ${{ inputs.sonar-project-name }}
          SCANNER_VERSION: ${{ inputs.sonar-scanner-version }}
          GATE_TIMEOUT: ${{ inputs.quality-gate-timeout }}
          GATE_POLLING_INTERVAL: ${{ inputs.quality-gate-polling-interval }}
          ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact-retention-days }}
        run: |
          set -Eeuo pipefail

          if [[ "$RUNNER_OS_NAME" != "Linux" || "$RUNNER_ARCH_NAME" != "X64" ]]; then
            echo "::error::This workflow currently requires a Linux x64 runner because the shared SonarScanner setup installs the Linux x64 CLI."
            exit 1
          fi

          if [[ ! -d "$WORKING_DIRECTORY" ]]; then
            echo "::error::Gradle working directory '$WORKING_DIRECTORY' does not exist after checkout."
            exit 1
          fi

          if [[ -z "$SONAR_PROJECT_KEY" || -z "$SONAR_PROJECT_NAME" || -z "$SONAR_SOURCES" || -z "$SONAR_BINARIES" ]]; then
            echo "::error::Project key, project name, source directory, and binaries directory must not be empty."
            exit 1
          fi

          if [[ "$SONAR_SOURCES" == "$SONAR_TESTS" || "$SONAR_SOURCES/" == "$SONAR_TESTS/"* || "$SONAR_TESTS/" == "$SONAR_SOURCES/"* ]]; then
            echo "::error::Sonar source and test directories must not overlap."
            exit 1
          fi

          if [[ ! "$SCANNER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid SonarScanner version: $SCANNER_VERSION"
            exit 1
          fi

          if [[ ! "$GATE_TIMEOUT" =~ ^[1-9][0-9]*$ || ! "$GATE_POLLING_INTERVAL" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Quality Gate timeout and polling interval must be positive whole numbers."
            exit 1
          fi

          if [[ ! "$ARTIFACT_RETENTION_DAYS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Artifact retention days must be a positive whole number."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
        with:
          gradle-wrapper-path: ${{ inputs.sonar-working-directory }}/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper
        shell: bash
        working-directory: ${{ inputs.sonar-working-directory }}
        run: |
          set -Eeuo pipefail

          if [[ ! -f ./gradlew ]]; then
            echo "::error::Gradle wrapper (gradlew) was not found in '$PWD'."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Project and Generate Reports
        shell: bash
        working-directory: ${{ inputs.sonar-working-directory }}
        env:
          GRADLE_COMMAND: ${{ inputs.gradle-command }}
          JACOCO_REPORT_PATH: ${{ inputs.sonar-jacoco-report-path }}
        run: |
          set -Eeuo pipefail

          read -r -a gradle_args <<< "$GRADLE_COMMAND"
          if (( ${#gradle_args[@]} == 0 )); then
            echo "::error::gradle-command must contain at least one Gradle task or argument."
            exit 1
          fi

          ./gradlew --no-daemon --stacktrace --warning-mode=all "${gradle_args[@]}"

          if [[ ! -f "$JACOCO_REPORT_PATH" ]]; then
            echo "::error::JaCoCo XML report was not generated at '$JACOCO_REPORT_PATH'. Configure the Gradle JaCoCo plugin and report task, or set sonar-jacoco-report-path to the generated report."
            exit 1
          fi

      - name: Setup SonarScanner
        uses: Maverick-Joy/reusable-workflows/.github/actions/setup-sonarscanner@main
        with:
          scanner-version: ${{ inputs.sonar-scanner-version }}

      - name: Run SonarScanner
        shell: bash
        working-directory: ${{ inputs.sonar-working-directory }}
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
          SONAR_PROJECT_NAME: ${{ inputs.sonar-project-name }}
          SONAR_ORGANIZATION: ${{ inputs.sonar-organization }}
          SONAR_SOURCES: ${{ inputs.sonar-sources }}
          SONAR_TESTS: ${{ inputs.sonar-tests }}
          SONAR_BINARIES: ${{ inputs.sonar-java-binaries }}
          SONAR_TEST_BINARIES: ${{ inputs.sonar-java-test-binaries }}
          SONAR_JUNIT_REPORT_PATH: ${{ inputs.sonar-junit-report-path }}
          SONAR_JACOCO_REPORT_PATH: ${{ inputs.sonar-jacoco-report-path }}
          SONAR_EXCLUSIONS: ${{ inputs.sonar-exclusions }}
          SONAR_ADDITIONAL_ARGS: ${{ inputs.sonar-additional-args }}
        run: |
          set -Eeuo pipefail

          if [[ ! -d "$SONAR_SOURCES" ]]; then
            echo "::error::Sonar source directory '$SONAR_SOURCES' does not exist under '$PWD'."
            exit 1
          fi
          if [[ ! -d "$SONAR_BINARIES" ]]; then
            echo "::error::Compiled Java classes directory '$SONAR_BINARIES' does not exist under '$PWD'."
            exit 1
          fi
          if [[ ! -f "$SONAR_JACOCO_REPORT_PATH" ]]; then
            echo "::error::JaCoCo XML report '$SONAR_JACOCO_REPORT_PATH' does not exist under '$PWD'."
            exit 1
          fi

          sonar_args=(
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY"
            "-Dsonar.projectName=$SONAR_PROJECT_NAME"
            "-Dsonar.projectVersion=$GITHUB_RUN_NUMBER"
            "-Dsonar.projectBaseDir=$PWD"
            "-Dsonar.sources=$SONAR_SOURCES"
            "-Dsonar.java.binaries=$SONAR_BINARIES"
            "-Dsonar.junit.reportPaths=$SONAR_JUNIT_REPORT_PATH"
            "-Dsonar.coverage.jacoco.xmlReportPaths=$SONAR_JACOCO_REPORT_PATH"
            "-Dsonar.scm.provider=git"
            "-Dsonar.sourceEncoding=UTF-8"
          )

          if [[ -n "$SONAR_ORGANIZATION" ]]; then
            sonar_args+=("-Dsonar.organization=$SONAR_ORGANIZATION")
          fi

          if [[ -n "$SONAR_EXCLUSIONS" ]]; then
            sonar_args+=("-Dsonar.exclusions=$SONAR_EXCLUSIONS")
          fi

          if [[ -d "$SONAR_TESTS" ]]; then
            sonar_args+=("-Dsonar.tests=$SONAR_TESTS")
            if [[ -d "$SONAR_TEST_BINARIES" ]]; then
              sonar_args+=("-Dsonar.java.test.binaries=$SONAR_TEST_BINARIES")
            else
              echo "::warning::Test binaries directory '$SONAR_TEST_BINARIES' does not exist; test binary analysis will be skipped."
            fi
          else
            echo "::warning::Test source directory '$SONAR_TESTS' does not exist; test source analysis will be skipped."
          fi

          if [[ -n "$SONAR_ADDITIONAL_ARGS" ]]; then
            read -r -a additional_args <<< "$SONAR_ADDITIONAL_ARGS"
            sonar_args+=("${additional_args[@]}")
          fi

          sonar-scanner "${sonar_args[@]}"

      - name: Verify Sonar Task Metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -s "$SONAR_WORKING_DIRECTORY/.scannerwork/report-task.txt" ]]; then
            echo "::error::Sonar task metadata was not created in '$SONAR_WORKING_DIRECTORY/.scannerwork/report-task.txt'."
            exit 1
          fi
        env:
          SONAR_WORKING_DIRECTORY: ${{ inputs.sonar-working-directory }}

      - name: Verify SonarQube Quality Gate
        id: quality-gate
        uses: Maverick-Joy/reusable-workflows/.github/actions/sonarqube-quality-gate@main
        with:
          sonar-host-url: ${{ secrets.SONAR_HOST_URL }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          timeout: ${{ inputs.quality-gate-timeout }}
          polling-interval: ${{ inputs.quality-gate-polling-interval }}
          working-directory: ${{ inputs.sonar-working-directory }}

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.test-report-artifact-name }}
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: warn
          path: |
            ${{ inputs.sonar-working-directory }}/build/reports/tests/**
            ${{ inputs.sonar-working-directory }}/build/test-results/**

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.coverage-report-artifact-name }}
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: warn
          path: ${{ inputs.sonar-working-directory }}/${{ inputs.sonar-jacoco-report-path }}

      - name: Upload Sonar Task Metadata
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sonar-scanner-files
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: ignore
          path: ${{ inputs.sonar-working-directory }}/.scannerwork/**

      - name: Generate GitHub Summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          GATE_STATUS: ${{ steps.quality-gate.outputs.quality-gate-status }}
          DASHBOARD_URL: ${{ steps.quality-gate.outputs.dashboard-url }}
          PROJECT_NAME: ${{ inputs.sonar-project-name }}
          PROJECT_KEY: ${{ inputs.sonar-project-key }}
          WORKING_DIRECTORY: ${{ inputs.sonar-working-directory }}
          GRADLE_COMMAND: ${{ inputs.gradle-command }}
          SONAR_SCANNER_VERSION: ${{ inputs.sonar-scanner-version }}
          JAVA_VERSION: ${{ inputs.java-version }}
          RUNNER_NAME: ${{ runner.name }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail

          sanitize_markdown_cell() {
            local value="${1//$'\n'/ }"
            value="${value//$'\r'/ }"
            value="${value//|/\\|}"
            printf '%s' "$value"
          }

          if [[ "$JOB_STATUS" == "success" ]]; then
            result="Succeeded"
          else
            result="Failed"
          fi

          {
            printf '# SonarQube Analysis %s\n\n' "$result"
            printf '| Property | Value |\n'
            printf '|----------|-------|\n'
            printf '| Project | %s |\n' "$(sanitize_markdown_cell "$PROJECT_NAME")"
            printf '| Project Key | %s |\n' "$(sanitize_markdown_cell "$PROJECT_KEY")"
            printf '| Quality Gate | %s |\n' "$(sanitize_markdown_cell "${GATE_STATUS:-NOT_COMPLETED}")"
            printf '| Dashboard | %s |\n' "$(sanitize_markdown_cell "${DASHBOARD_URL:-NOT_AVAILABLE}")"
            printf '| Branch | %s |\n' "$(sanitize_markdown_cell "$BRANCH_NAME")"
            printf '| Commit | `%s` |\n' "$(sanitize_markdown_cell "$COMMIT_SHA")"
            printf '| Runner | %s |\n' "$(sanitize_markdown_cell "${RUNNER_NAME:-unknown}")"
            printf '| Java | %s |\n' "$(sanitize_markdown_cell "$JAVA_VERSION")"
            printf '| SonarScanner | %s |\n' "$(sanitize_markdown_cell "$SONAR_SCANNER_VERSION")"
            printf '| Gradle command | `%s` |\n' "$(sanitize_markdown_cell "$GRADLE_COMMAND")"
            printf '| Working directory | `%s` |\n' "$(sanitize_markdown_cell "$WORKING_DIRECTORY")"
            printf '| Workflow run | %s |\n' "$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
