name: Unit Test (Gradle)

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version
        required: false
        default: "21"
        type: string
      distribution:
        description: JDK distribution
        required: false
        default: "temurin"
        type: string
      gradle-command:
        description: Gradle test command
        required: false
        default: "clean test jacocoTestReport"
        type: string
      upload-artifacts:
        description: Upload reports
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: unit-test-gradle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Execute Unit Tests
        run: ./gradlew ${{ inputs.gradle-command }}

      - name: Publish Unit Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            **/build/test-results/test/*.xml

      - name: Upload Test Results
        if: always() && inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-results
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload JaCoCo Report
        if: always() && inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gradle-jacoco-report
          path: |
            **/build/reports/jacoco/**
          if-no-files-found: warn
          retention-days: 7

      - name: GitHub Summary
        if: always()
        run: |
          {
            echo "# Gradle Unit Test Summary"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Java | ${{ inputs.java-version }} |"
            echo "| Distribution | ${{ inputs.distribution }} |"
            echo "| Command | `${{ inputs.gradle-command }}` |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
