name: Setup SonarScanner

description: Installs and verifies the SonarScanner CLI on a Linux x64 runner.

inputs:
  scanner-version:
    description: SonarScanner CLI version
    required: false
    default: "7.2.0.5079"

runs:
  using: composite
  steps:
    - name: Validate SonarScanner Version
      shell: bash
      env:
        SCANNER_VERSION: ${{ inputs.scanner-version }}
      run: |
        set -Eeuo pipefail

        if [[ ! "$SCANNER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid SonarScanner version: $SCANNER_VERSION"
          exit 1
        fi

    - name: Cache SonarScanner
      id: scanner-cache
      uses: actions/cache@v6.1.0
      with:
        path: ~/.sonar/sonar-scanner
        key: sonar-scanner-${{ runner.os }}-${{ runner.arch }}-${{ inputs.scanner-version }}

    - name: Install SonarScanner
      if: steps.scanner-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SCANNER_VERSION: ${{ inputs.scanner-version }}
      run: |
        set -Eeuo pipefail

        if ! command -v curl >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
          echo "::error::SonarScanner setup requires curl and unzip."
          exit 1
        fi

        install_dir="$HOME/.sonar"
        scanner_dir="$install_dir/sonar-scanner"
        archive="/tmp/sonar-scanner-cli-${SCANNER_VERSION}-linux-x64.zip"
        extracted_dir="/tmp/sonar-scanner-${SCANNER_VERSION}-linux-x64"
        url="https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SCANNER_VERSION}-linux-x64.zip"

        mkdir -p "$install_dir"
        curl --retry 3 --retry-delay 5 --retry-all-errors -fsSL "$url" -o "$archive"
        unzip -q -o "$archive" -d /tmp

        if [ ! -x "$extracted_dir/bin/sonar-scanner" ]; then
          echo "::error::SonarScanner executable was not found after extraction."
          exit 1
        fi

        mkdir -p "$scanner_dir"
        cp -a "$extracted_dir/." "$scanner_dir/"

    - name: Verify SonarScanner
      shell: bash
      run: |
        set -Eeuo pipefail

        scanner="$HOME/.sonar/sonar-scanner/bin/sonar-scanner"
        if [ ! -x "$scanner" ]; then
          echo "::error::SonarScanner executable is missing from the cache or installation."
          exit 1
        fi

        echo "$(dirname "$scanner")" >> "$GITHUB_PATH"
        "$scanner" --version
